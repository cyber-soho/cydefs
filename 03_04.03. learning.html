<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Cyber.SoHo">
    <title>Network Access Control — Practice Tests (30+ MCQ, 10+ MSQ)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Calibri, Arial, sans-serif;
            background: #fdf6e3;
            color: #073642;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fffdf7;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 8px 30px rgba(7, 54, 66, 0.12);
        }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 28px;
            color: #073642;
            border-bottom: 2px solid #d9d2be;
            padding-bottom: 12px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 15px;
            font-family: Calibri, 'Segoe UI', Arial, sans-serif;
            font-weight: 400;
            color: #586e75;
        }
        .subhead {
            background: #eee8d5;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 28px;
            font-size: 14px;
            color: #073642;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .subhead span {
            background: #268bd2;
            color: #fff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .section-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 20px;
            color: #073642;
            margin: 32px 0 14px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #d9d2be;
        }
        .question {
            background: #ffffff;
            border: 1px solid #d9d2be;
            border-radius: 10px;
            padding: 16px 20px 14px 20px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .question.correct {
            border-color: #859900;
            background: #f4f8f0;
        }
        .question.incorrect {
            border-color: #dc322f;
            background: #fdf0ee;
        }
        .q-head {
            display: flex;
            gap: 10px;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .q-num {
            font-weight: 700;
            color: #268bd2;
            font-size: 15px;
            min-width: 32px;
        }
        .q-type {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            background: #6c71c4;
            padding: 1px 10px;
            border-radius: 12px;
        }
        .q-type.mcq {
            background: #268bd2;
        }
        .q-type.msq {
            background: #6c71c4;
        }
        .q-text {
            font-size: 16px;
            font-weight: 500;
            color: #073642;
            margin-bottom: 8px;
        }
        .q-text .badge-msq {
            font-weight: 400;
            font-size: 13px;
            color: #6c71c4;
            background: #efe8fb;
            padding: 0 10px;
            border-radius: 12px;
            margin-left: 6px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 6px;
        }
        .options label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 5px 10px 5px 6px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .options label:hover {
            background: #f0ede3;
        }
        .options label input[type="radio"],
        .options label input[type="checkbox"] {
            margin-top: 4px;
            flex-shrink: 0;
            width: 17px;
            height: 17px;
            accent-color: #268bd2;
            cursor: pointer;
        }
        .options label.correct-answer {
            background: #e5f3e0;
            border-left: 4px solid #859900;
        }
        .options label.wrong-answer {
            background: #fde3df;
            border-left: 4px solid #dc322f;
        }
        .options label.missed-answer {
            background: #fff7dd;
            border-left: 4px solid #b58900;
        }
        .explanation {
            margin-top: 10px;
            padding: 10px 14px;
            background: #f8f6ed;
            border-radius: 6px;
            font-size: 14px;
            border-left: 3px solid #93a1a1;
            display: none;
        }
        .explanation.show {
            display: block;
        }
        .explanation .ok {
            color: #859900;
            font-weight: 600;
        }
        .explanation .no {
            color: #dc322f;
            font-weight: 600;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 28px 0 18px 0;
            padding-top: 18px;
            border-top: 1px solid #d9d2be;
        }
        .btn {
            font-family: Calibri, 'Segoe UI', Arial, sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 9px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #eee8d5;
            color: #073642;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #d9d2be;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #073642;
            color: #fdf6e3;
        }
        .btn-primary:hover {
            background: #268bd2;
        }
        .btn-success {
            background: #859900;
            color: #fff;
        }
        .btn-success:hover {
            background: #6b7a00;
        }
        .btn-danger {
            background: #dc322f;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b52a27;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #93a1a1;
        }
        .btn-outline:hover {
            background: #eee8d5;
        }
        .stats {
            font-size: 14px;
            color: #586e75;
            padding: 6px 0 0 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stats strong {
            color: #073642;
        }
        .footer-cs {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #d9d2be;
            text-align: center;
            color: #586e75;
            font-size: 14px;
        }
        .footer-cs img {
            height: 50px;
            vertical-align: middle;
            margin-right: 10px;
            background: #fff;
            border-radius: 4px;
        }
        .footer-cs .copy {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-cs .copy span {
            font-size: 13px;
        }
        @media (max-width: 700px) {
            .container {
                padding: 16px 14px;
            }
            h1 {
                font-size: 22px;
            }
            .q-text {
                font-size: 15px;
            }
            .options label {
                font-size: 14px;
            }
            .subhead {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .stats {
                flex-direction: column;
                gap: 4px;
            }
        }
        @media print {
            .btn,
            .actions {
                display: none !important;
            }
            .question {
                break-inside: avoid;
                border-color: #ccc;
            }
            .explanation.show {
                display: block !important;
            }
            .container {
                box-shadow: none;
                padding: 10px;
            }
            .options label.correct-answer,
            .options label.wrong-answer,
            .options label.missed-answer {
                background: transparent !important;
                border-left-color: transparent !important;
            }
        }
    </style>
</head>
